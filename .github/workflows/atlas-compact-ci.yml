name: ATLAS compact fast dashboard CI
on:
  push:
    branches: [feature/atlas-compact-fast-dashboard]
    paths: ['.github/workflows/atlas-compact-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Integrate compact overview
        run: python scripts/integrate_atlas_compact.py
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile app and modules
        run: python -m compileall -q app.py atlas_compact_dashboard.py atlas_sidebar.py
      - name: Regression and compact safety tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py test_atlas_kis_readonly.py test_atlas_autorefresh.py test_futures_quotes.py test_market_indicators.py test_atlas_ws_panel.py test_treasury_yields.py test_atlas_compact_dashboard.py
      - name: Commit integrated app if tests pass
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "ui: show compact 2s market board above scanner hero"
            git push origin HEAD:feature/atlas-compact-fast-dashboard
          fi
