name: ATLAS prebreakout TOP3 regression
on:
  push:
    branches: [feature/atlas-prebreakout-top3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile predictive screen
        run: python -m compileall -q app.py atlas_auto_candidate_board.py atlas_auto_candidates.py atlas_prebreakout.py
      - name: Run full regression and prebreakout tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py test_atlas_kis_readonly.py test_atlas_autorefresh.py test_futures_quotes.py test_market_indicators.py test_atlas_ws_panel.py test_treasury_yields.py test_atlas_compact_dashboard.py test_atlas_compact_smoke.py test_foreign_flow.py test_atlas_auto_candidates.py test_atlas_auto_candidates_smoke.py test_atlas_prebreakout.py
