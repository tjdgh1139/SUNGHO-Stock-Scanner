name: ATLAS global indices and live tape CI
on:
  push:
    branches: [feature/atlas-live-index-watch]
    paths:
      - '.github/workflows/atlas-live-index-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Integrate existing sidebar
        run: python scripts/integrate_atlas_global_live.py
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q app.py atlas_ws_panel.py atlas_global_panel.py market_indicators.py treasury_yields.py
      - name: Run full regression and new safety tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py test_atlas_kis_readonly.py test_atlas_autorefresh.py test_futures_quotes.py test_market_indicators.py test_atlas_ws_panel.py test_treasury_yields.py
      - name: Commit integrated app if tested
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "feat: show global indices and existing KIS WS diagnostics in sidebar"
            git push origin HEAD:feature/atlas-live-index-watch
          fi
