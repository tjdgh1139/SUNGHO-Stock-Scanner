name: ATLAS RC15 regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile scanner and adapters
        run: python -m compileall -q app.py feeds.py scoring.py performance.py ws_protocol.py flow_signals.py flow_adapter.py
      - name: Run regression tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
          DART_API_KEY: ""
          NAVER_CLIENT_ID: ""
          NAVER_CLIENT_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py
