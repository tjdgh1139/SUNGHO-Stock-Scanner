name: Embed ATLAS monitor in scanner
on:
  push:
    paths:
      - 'atlas_sidebar.py'
      - 'scripts/embed_atlas_monitor.py'
      - '.github/workflows/atlas-inline-monitor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  embed-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Embed monitor
        run: python scripts/embed_atlas_monitor.py
      - name: Install tests
        run: python -m pip install -r requirements-test.txt
      - name: Compile all
        run: python -m compileall -q app.py atlas_sidebar.py atlas_kis_readonly.py flow_signals.py flow_adapter.py
      - name: Regression and UI tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py test_atlas_kis_readonly.py
      - name: Commit tested integration
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "fix: embed ATLAS KIS monitor in existing scanner sidebar"
            git push origin HEAD:main
          fi
