name: ATLAS staging code sync (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-staging-sync
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests streamlit streamlit-autorefresh
      - name: Validate paper-only signal safety
        env:
          KIS_APP_KEY: ''
          KIS_APP_SECRET: ''
        run: python -m pytest -q test_atlas_paper_session_adapter.py test_atlas_paper_session_durability.py test_atlas_candidate_signal_gate.py test_atlas_paper_exit_gate.py test_atlas_signal_cycle.py
  sync:
    needs: test
    runs-on: ubuntu-latest
    environment: atlas-paper-staging
    timeout-minutes: 10
    steps:
      - name: Configure SSH (pinned known host)
        env:
          DEPLOY_KEY: ${{ secrets.ATLAS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ATLAS_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ATLAS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Validate pinned SSH host configuration (no secret output)
        env:
          DEPLOY_HOST: ${{ secrets.ATLAS_DEPLOY_HOST }}
        run: |
          set -eu
          case "$DEPLOY_HOST" in
            *[!0-9.]*|'') echo "::error::DEPLOY_HOST must be an IPv4 address without whitespace"; exit 1 ;;
          esac
          test "$(printf '%s' "$DEPLOY_HOST" | awk -F. '{print NF}')" -eq 4 || { echo "::error::DEPLOY_HOST malformed"; exit 1; }
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 >/dev/null || { echo "::error::Invalid known_hosts file"; exit 1; }
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::No matching known_hosts entry for configured DEPLOY_HOST (check hostname/IP and whitespace)"
            exit 1
          fi
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts | grep -q 'ssh-ed25519'; then
            echo "::error::Matching host entry is not ED25519"
            exit 1
          fi
          echo "Pinned ED25519 host entry format: OK"
      - name: Sync code to isolated staging directory (no Docker access)
        env:
          DEPLOY_HOST: ${{ secrets.ATLAS_DEPLOY_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "atlasdeploy@$DEPLOY_HOST"
