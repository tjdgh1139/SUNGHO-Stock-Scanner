name: ATLAS integrate delayed US futures
on:
  push:
    branches: [feature/atlas-30s-auto-refresh]
    paths:
      - '.github/workflows/atlas-futures-integrate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate macro provider
        run: python scripts/integrate_us_futures.py
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q app.py futures_quotes.py atlas_sidebar.py
      - name: Regression
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py test_atlas_kis_readonly.py test_atlas_autorefresh.py test_futures_quotes.py
      - name: Commit only tested changes
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "feat: display delayed US futures in ATLAS macro panel"
            git push origin HEAD:feature/atlas-30s-auto-refresh
          fi
