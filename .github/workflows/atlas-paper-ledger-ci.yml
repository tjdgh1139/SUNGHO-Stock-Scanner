name: ATLAS paper-trade ledger CI
on:
  push:
    branches: [feature/atlas-paper-trade-ledger]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q atlas_paper_ledger.py atlas_paper_store.py
      - name: Verify ledger and preopen regression
        run: python -m pytest -q test_atlas_paper_ledger.py test_atlas_paper_store.py test_atlas_preopen_monitor.py test_atlas_prebreakout.py
