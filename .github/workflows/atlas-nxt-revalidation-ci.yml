name: ATLAS NXT premarket revalidation
on:
  push:
    branches: [feature/atlas-nxt-early-revalidation]
    paths: ['.github/workflows/atlas-nxt-revalidation-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate NXT
        run: python scripts/integrate_nxt_revalidation.py
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q app.py atlas_nxt_revalidation.py atlas_preopen_tracker_panel.py
      - name: Run regression and NXT tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_atlas_preopen_monitor.py test_atlas_nxt_revalidation.py test_atlas_auto_candidates.py test_opening_flow_radar.py
      - name: Commit verified app integration
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "feat: NXT 08:00 premarket reranking of frozen candidates"
            git fetch origin feature/atlas-nxt-early-revalidation
            git rebase origin/feature/atlas-nxt-early-revalidation
            git push origin HEAD:feature/atlas-nxt-early-revalidation
          fi
