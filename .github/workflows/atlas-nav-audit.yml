name: ATLAS navigation audit
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/atlas-nav-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Streamlit navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.py')
          t=p.read_text(encoding='utf-8')
          print('APP_BYTES',p.stat().st_size,'APP_LINES',t.count('\n')+1)
          for pattern in ('st.navigation','st.Page(','st.set_page_config','showSidebarNavigation','page_link','st.sidebar','pages/','display: none'):
              found=[(i,l[:180]) for i,l in enumerate(t.splitlines(),1) if pattern in l]
              print('PATTERN',repr(pattern),'COUNT',len(found),'SAMPLES',found[:7])
          print('PAGES', [str(x) for x in Path('pages').glob('*.py')])\n          for a,b in [(1240,1270),(2715,2755)]:\n              print('SECTION',a,b, '\\n'.join(f'{i+1}: {t.splitlines()[i][:200]}' for i in range(a-1,min(b,len(t.splitlines())))))\n          for p in ('stSidebarNav','stSidebarNavItems','data-testid','visibility: hidden'):\n              print('CSS',p, [(i+1,l[:160]) for i,l in enumerate(t.splitlines()) if p in l][:12])
          print('HEAD', '\n'.join(t.splitlines()[:45]))
          PY
