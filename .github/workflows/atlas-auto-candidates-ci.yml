name: ATLAS autonomous KR US candidate CI
on:
  push:
    branches: [feature/atlas-autonomous-kr-us-candidates]
    paths: ['.github/workflows/atlas-auto-candidates-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Integrate automatic candidate board
        run: python scripts/integrate_auto_candidate_board.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile modules
        run: python -m compileall -q app.py atlas_auto_candidates.py atlas_auto_candidate_board.py
      - name: Run full regression and new candidate tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_flow_signals.py test_flow_adapter.py test_atlas_kis_readonly.py test_atlas_autorefresh.py test_futures_quotes.py test_market_indicators.py test_atlas_ws_panel.py test_treasury_yields.py test_atlas_compact_dashboard.py test_atlas_compact_smoke.py test_foreign_flow.py test_atlas_auto_candidates.py test_atlas_auto_candidates_smoke.py
      - name: Commit integrated app after passing tests
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "feat: add auto KR/US candidate board without manual scan"
            git push origin HEAD:feature/atlas-autonomous-kr-us-candidates
          fi
# Verify 2s WS display and updated integration call
