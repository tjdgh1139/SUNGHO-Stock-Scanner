name: ATLAS catalyst leader tests
on:
  push:
    branches: [feature/atlas-catalyst-sector-leaders]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q catalyst_sector_leaders.py
      - name: Run catalyst and scanner regressions
        run: python -m pytest -q test_catalyst_sector_leaders.py test_atlas_prebreakout.py test_atlas_auto_candidates.py test_foreign_flow.py
