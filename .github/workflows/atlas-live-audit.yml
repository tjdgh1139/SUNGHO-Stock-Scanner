name: Inspect existing ATLAS live tape
on:
  push:
    branches: [feature/atlas-live-index-watch]
    paths: ['.github/workflows/atlas-live-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live subscriptions and sidebar
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          t=Path('app.py').read_text(encoding='utf-8').splitlines()
          tree=ast.parse('\n'.join(t))
          for n in ast.walk(tree):
              if isinstance(n,(ast.FunctionDef,ast.ClassDef)) and any(k in n.name.lower() for k in ('live','tape','future','index','websocket','subscribe','ws_')):
                  print('DEF',n.name,n.lineno,getattr(n,'end_lineno',0))
          for a,b in [(2100,2210),(2300,2450),(2480,2660),(2725,2765)]:
              print('SECTION',a,b)
              for i in range(a-1,min(b,len(t))):print(f'{i+1}: {t[i][:200]}')
          PY
