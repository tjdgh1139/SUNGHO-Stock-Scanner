name: ATLAS scheduled KR preopen TOP5
on:
  schedule:
    # UTC Sunday-Thursday 22:00 / 22:55 = KST Monday-Friday 07:00 / 07:50 / 07:55.
    # KST does not observe DST. PT display adjusts between PDT and PST.
    - cron: '0 22 * * 0-4'
    - cron: '50 22 * * 0-4'
    - cron: '55 22 * * 0-4'
  workflow_dispatch:
  push:
    branches: [feature/atlas-background-preopen]
    paths: ['.github/workflows/atlas-scheduled-preopen.yml']
permissions:
  contents: write
concurrency:
  group: atlas-preopen-snapshot
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt "exchange-calendars>=4.13,<5"
      - name: Compile
        run: python -m compileall -q atlas_preopen_background.py atlas_preopen_published.py atlas_preopen_job.py atlas_market_calendar.py atlas_preopen_tracker_panel.py atlas_auto_candidate_board.py atlas_auto_candidates.py atlas_prebreakout.py
      - name: Test preopen safety and scheduling
        run: python -m pytest -q test_atlas_background_preopen.py test_atlas_preopen_monitor.py test_atlas_auto_candidates.py test_atlas_prebreakout.py test_atlas_nxt_revalidation.py
  publish:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public historical price provider
        run: python -m pip install -r requirements.txt "exchange-calendars>=4.13,<5"
      - name: Build source-validated preopen candidates
        id: build
        run: |
          python atlas_preopen_job.py
          if [ -n "$(git status --porcelain -- data/atlas_preopen_kr_latest.json)" ]; then
            echo "snapshot_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preflight 07:55 KST recheck evidence (fail closed)
        if: github.event_name == 'schedule' && github.event.schedule == '55 22 * * 0-4'
        env:
          ATLAS_PUBLISHED_RECHECK: ${{ steps.build.outputs.snapshot_changed }}
        run: python scripts/audit_preopen_0755.py data/atlas_preopen_kr_latest.json
      - name: Commit only if a verified snapshot exists
        run: |
          if [ -n "$(git status --porcelain -- data/atlas_preopen_kr_latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/atlas_preopen_kr_latest.json
            git commit -m "data: publish verified ATLAS preopen EOD TOP5"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Verify 07:55 KST publication before 08:00 (fail closed)
        if: github.event_name == 'schedule' && github.event.schedule == '55 22 * * 0-4'
        env:
          ATLAS_PUBLISHED_RECHECK: ${{ steps.build.outputs.snapshot_changed }}
        run: python scripts/audit_preopen_0755.py data/atlas_preopen_kr_latest.json
# Regression includes PT/KST generated-time labels and auto-load guards
# Final preopen calendar and PT timezone regression
