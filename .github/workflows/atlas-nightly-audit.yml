name: ATLAS scheduled development audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: atlas-scheduled-audit
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated ATLAS staging branch
        uses: actions/checkout@v4
        with:
          ref: atlas/market-data-storage-staging
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_atlas_market_collection \
            test_atlas_cycle_coordinator \
            test_atlas_kis_health_cli \
            test_atlas_request_pacer \
            test_atlas_rate_limit_guard \
            test_atlas_quote_quality_audit \
            test_atlas_collection_quality_report \
            test_atlas_receipt_gap_report \
            test_atlas_collection_capacity \
            test_atlas_quote_latency 2>&1 | tee atlas-audit-results.txt
      - name: Preserve audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-scheduled-audit
          path: atlas-audit-results.txt
          if-no-files-found: warn
          retention-days: 14
