name: ATLAS public futures feed probe
on:
  push:
    paths: ['.github/workflows/atlas-futures-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Probe all 3 public futures quotes
        run: |
          python - <<'PY'
          from futures_quotes import futures_snapshot
          for r in futures_snapshot():
              print(r['지표'],r['심볼'],r.get('최근값','unavailable'),r.get('기준일',''),r['상태'])
          PY
