name: ATLAS Codex manual pilot
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-codex-manual-pilot
  cancel-in-progress: false

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/market-data-storage-staging
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require explicitly configured AI key
        env:
          ATLAS_CODEX_API_KEY: ${{ secrets.ATLAS_CODEX_API_KEY }}
        run: |
          if [ -z "$ATLAS_CODEX_API_KEY" ]; then
            echo "::error::ATLAS_CODEX_API_KEY missing. No model was called."
            exit 1
          fi
      - name: Codex test-only pilot (no push)
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.ATLAS_CODEX_API_KEY }}
          safety-strategy: drop-sudo
          permission-profile: ":workspace"
          prompt: |
            Inspect the repository and improve ONE existing test_atlas_*.py file.
            Never modify production modules, workflow files, authentication,
            secrets, deployment configuration, AGENTS.md or trading code.
            Do not call brokerage APIs, place orders, or use network access.
            Keep changes minimal and explain them in the final response.
            No commits, pushes, PR creation, or deployment.
      - name: Verify changed paths and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRD > /tmp/atlas-changed-paths.txt
          test -s /tmp/atlas-changed-paths.txt
          mapfile -t paths < /tmp/atlas-changed-paths.txt
          python atlas_ai_change_scope.py "${paths[@]}"
          python -m unittest -v test_atlas_ai_change_scope
          for path in "${paths[@]}"; do
            if [[ "$path" == test_atlas_*.py ]]; then
              python -m unittest -v "${path%.py}"
            fi
          done
          git diff --check
      - name: Preserve reviewed patch (no push)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > atlas-codex-pilot.patch
          test -s atlas-codex-pilot.patch
      - name: Upload patch for human review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-codex-pilot-patch
          path: atlas-codex-pilot.patch
          retention-days: 14
