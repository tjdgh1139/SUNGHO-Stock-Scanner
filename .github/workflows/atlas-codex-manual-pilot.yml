name: ATLAS Codex manual pilot
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-codex-manual-pilot
  cancel-in-progress: false

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/market-data-storage-staging
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require explicitly configured AI key
        env:
          ATLAS_CODEX_API_KEY: ${{ secrets.ATLAS_CODEX_API_KEY }}
        run: |
          if [ -z "$ATLAS_CODEX_API_KEY" ]; then
            echo "::error::ATLAS_CODEX_API_KEY missing. No model was called."
            exit 1
          fi
      - name: Codex test-only pilot (no push)
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.ATLAS_CODEX_API_KEY }}
          safety-strategy: drop-sudo
          permission-profile: ":workspace"
          prompt: |
            Inspect the repository and improve ONE existing test_atlas_*.py file.
            Never modify production modules, workflow files, authentication,
            secrets, deployment configuration, AGENTS.md or trading code.
            Do not call brokerage APIs, place orders, or use network access.
            Keep changes minimal and explain them in the final response.
            No commits, pushes, PR creation, or deployment.
      - name: Verify changed paths and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRD > /tmp/atlas-changed-paths.txt
          test -s /tmp/atlas-changed-paths.txt
          mapfile -t paths < /tmp/atlas-changed-paths.txt
          python atlas_ai_change_scope.py "${paths[@]}"
          python -m unittest -v test_atlas_ai_change_scope
          for path in "${paths[@]}"; do
            if [[ "$path" == test_atlas_*.py ]]; then
              python -m unittest -v "${path%.py}"
            fi
          done
          git diff --check
      - name: Preserve reviewed patch (no push)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > atlas-codex-pilot.patch
          test -s atlas-codex-pilot.patch
      - name: Upload patch for human review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-codex-pilot-patch
          path: atlas-codex-pilot.patch
          retention-days: 14

  draft-pr:
    needs: codex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/market-data-storage-staging
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: atlas-codex-pilot-patch
          path: /tmp/atlas-proposal
      - name: Validate patch without executing generated code
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/atlas-proposal/atlas-codex-pilot.patch
          git apply --check /tmp/atlas-proposal/atlas-codex-pilot.patch
          git apply /tmp/atlas-proposal/atlas-codex-pilot.patch
          git diff --check
          git diff --name-only --diff-filter=ACMRD > /tmp/atlas-proposal/paths.txt
          test -s /tmp/atlas-proposal/paths.txt
          mapfile -t paths < /tmp/atlas-proposal/paths.txt
          # Pilot is restricted to exactly one existing test file, never deletions.
          if [ "${#paths[@]}" -ne 1 ]; then
            echo "Pilot must change exactly one test file"; exit 1
          fi
          if git diff --name-only --diff-filter=D | grep -q .; then
            echo "File deletions are forbidden"; exit 1
          fi
          if [[ ! "${paths[0]}" =~ ^test_atlas_[A-Za-z0-9_]+[.]py$ ]]; then
            echo "Pilot may only change an existing test_atlas_*.py file"; exit 1
          fi
          # Do not execute untrusted repository code in this write-enabled job.
          for path in "${paths[@]}"; do
            if [[ ! "$path" =~ ^test_atlas_[A-Za-z0-9_]+[.]py$ ]] &&
               [[ "$path" != "ATLAS_AI_DRAFT_PR_ACTIVATION.md" ]] &&
               [[ "$path" != "ATLAS_UNATTENDED_DEVELOPMENT.md" ]]; then
              echo "Forbidden changed path: $path"
              exit 1
            fi
          done
          # No generated code is executed in this privileged job.
          if git diff --name-only --diff-filter=T | grep .; then
            echo "File type changes are forbidden"; exit 1
          fi
          while IFS= read -r path; do
            if [ -L "$path" ]; then echo "Symlink forbidden: $path"; exit 1; fi
          done < /tmp/atlas-proposal/paths.txt
      - name: Submit draft PR (never merge)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="atlas/ai-pilot-${RUN_ID}"
          # A retry may reuse a branch created by the previous attempt.
          # Never overwrite an existing remote branch or duplicate a PR.
          existing_pr="$(gh pr list --state all --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Existing PR #$existing_pr for $branch; nothing to recreate."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Remote branch already exists; create its draft PR without pushing."
            gh pr create --draft --base atlas/market-data-storage-staging --head "$branch" \
              --title "ATLAS Codex test-only pilot #${RUN_ID}" \
              --body "Automated test-only proposal. Requires human review and passing CI. No auto-merge or deployment."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          mapfile -t paths < /tmp/atlas-proposal/paths.txt
          git add -- "${paths[@]}"
          git commit -m "test: Codex pilot draft proposal"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base atlas/market-data-storage-staging --head "$branch" \
            --title "ATLAS Codex test-only pilot #${RUN_ID}" \
            --body "Automated test-only proposal. Requires human review and passing CI. No auto-merge or deployment."
