name: ATLAS live KR quote adapter CI
on:
  push:
    branches: [fix/atlas-kr-auto-scan-data-adapter]
    paths: ['.github/workflows/atlas-kr-quote-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile scanner and adapter
        run: python -m compileall -q atlas_auto_candidates.py atlas_auto_candidate_board.py
      - name: Run regressions and WS quote tests
        run: python -m pytest -q test_atlas_ws_quote_adapter.py test_atlas_auto_candidates.py test_atlas_prebreakout.py test_atlas_ws_panel.py
