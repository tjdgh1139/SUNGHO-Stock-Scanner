name: ATLAS opening 1 3 5 minute flow radar CI
on:
  push:
    branches: [feature/atlas-opening-flow-radar]
    paths: ['.github/workflows/atlas-opening-flow-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate opening radar
        run: python scripts/integrate_opening_flow_radar.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q app.py opening_flow_radar.py atlas_opening_flow_panel.py
      - name: Regression and opening radar safety tests
        env:
          KIS_APP_KEY: ""
          KIS_APP_SECRET: ""
        run: python -m pytest -q test_regression.py test_atlas_prebreakout.py test_atlas_auto_candidates.py test_foreign_flow.py test_opening_flow_radar.py
      - name: Commit tested integration
        run: |
          if ! git diff --quiet -- app.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.py
            git commit -m "feat: show KIS opening 1 3 5-minute turnover radar"
            git push origin HEAD:feature/atlas-opening-flow-radar
          fi
